      - name: complaint_review_rate
        expression:
          sql: AVG(CASE WHEN review_score IN (1, 2) THEN 100.0 WHEN review_score IN (3, 4, 5) THEN 0.0 END)
        description: 불만 리뷰 비율(%). 1~5점 리뷰 중 1~2점 리뷰의 비율이고 0~100 단위다
        datatype: Decimal
        ai_context:
          synonyms: [불만 리뷰 비율, 고객 불만 비율, 불만 비율, 저평점 리뷰 비율, 1~2점 비율]
          instructions: >-
            리뷰 생성일(review_creation_date__day)별로 본다.
            불만 리뷰는 review_score 가 1 또는 2 인 리뷰다. 리뷰 글 내용은 보지 않는다.
            분모는 점수가 1~5 인 리뷰 행 수, 분자는 그중 1~2점 리뷰 행 수다. 고객 수나 주문 수를 세지 않는다.
            값은 0~100 단위 퍼센트다. 두 날짜의 증감은 퍼센트포인트(pp)로 빼서 낸다.
            날짜는 review_creation_date(리뷰 생성일)로 자른다. 리뷰 응답 시각이 아니다.
            그날 리뷰가 없으면 값은 NULL 이다. 하루 리뷰 수가 1건에서 수백 건까지라 리뷰가 적은 날은 값이 크게 흔들린다
          examples: [2018년 7월 15일 생성 리뷰의 불만 리뷰 비율, 일별 불만 리뷰 비율]
        nonportable_extensions:
          - vendor_name: TEXT2SQL
            data:
              status: approved
              decision: eval_accuracy_comparison
              discovery:
              - q: 한 건의 단위
                a: 리뷰 표 1행. 분모는 1~5점 리뷰, 분자는 그중 1~2점 리뷰
                by: 평가 담당자
                at: '2026-11-11'
              - q: 불만 판정
