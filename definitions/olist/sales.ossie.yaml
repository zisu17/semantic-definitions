  - name: order_items
    source: order_items
    primary_key: [order_id, order_item_id]
    description: >-
      주문 상품 항목 1개가 1행이다. 같은 주문과 상품에 여러 항목이 있을 수 있다.
      상품 항목 수는 행을 세고 판매자별·카테고리별 주문 수는 그룹 안의 고유 order_id를 센다.
      주문 단위 금액을 상품·결제·리뷰와 함께 보면 각 표를 필요한 단위로 먼저 집계한다.
    fields:
      - name: order_id
        expression: {sql: order_id}
        datatype: String
        description: 상품 항목이 속한 주문 ID. orders.order_id와 연결한다
      - name: order_item_id
        expression: {sql: order_item_id}
        datatype: Integer
        description: 주문 안에서의 상품 항목 순번(1부터). order_id와 함께 상품 항목 행을 식별한다
      - name: product_id
        expression: {sql: product_id}
        datatype: String
        description: 상품 자체의 ID. products.product_id와 연결한다
      - name: seller_id
        expression: {sql: seller_id}
        datatype: String
        description: 상품 항목을 판매한 판매자의 ID. sellers.seller_id와 연결한다
      - name: shipping_limit_date
        expression: {sql: shipping_limit_date}
        datatype: DateTime
        description: 판매자가 상품을 물류사에 넘겨야 하는 기한. SQLite 사본에서는 YYYY-MM-DD HH:MM:SS 형식의 텍스트다
        ai_context:
          synonyms: [발송 기한, 출고 기한]
      - name: price
        expression: {sql: price}
        datatype: Decimal
        description: 주문 상품 항목 한 줄의 상품 가격. 배송비와 별도로 기록한다
        ai_context:
          synonyms: [상품 가격, 판매가]
      - name: freight_value
        expression: {sql: freight_value}
        datatype: Decimal
        description: 주문 상품 항목 한 줄에 배분된 배송비. 주문별 배송비는 해당 주문의 항목 금액을 합산한다
    metrics:
      - name: item_count
        expression:
          sql: COUNT(*)
        description: 주문 상품 줄 수. 주문 상품 표 한 행을 한 개로 센다. 같은 상품을 여러 개 사면 행마다 센다. 주문 상태는 기본으로 거르지 않는다
        datatype: Integer
        ai_context:
          synonyms: [주문 상품 줄 수, 상품 줄 수, 판매 상품 수, 판매량, 주문 상품 수, 상품 개수]
          instructions: >-
            주문 월(orders.order_purchase_timestamp__month)별, 판매자 주(sellers.seller_state)별, 상품 카테고리별로 본다.
            주문 상품 한 행을 한 번 센다. 주문 수도, 서로 다른 상품 수도, 등록 상품 수도 아니다.
            주문 상태는 기본으로 거르지 않는다. 질문이 정하면 orders.order_status 조건을 붙인다.
            카테고리가 빈 상품은 products.product_category_name IS NULL, 영문 번역이 없는 상품은 product_category_name_english IS NULL 로 고른다.
            기간은 orders.order_purchase_timestamp(주문일) 기준으로 자른다
          examples: [2018년 1분기 배송 완료 주문의 월별 상품 줄 수, 2018년 배송 완료 주문의 판매자 주별 상품 줄 수, 카테고리 영문명이 없는 상품의 연도별 상품 줄 수]
        nonportable_extensions:
          - vendor_name: TEXT2SQL
            data:
              status: approved
              decision: eval_accuracy_comparison
              discovery:
              - q: 한 건의 단위
                a: 주문 상품 1행(order_items)
                by: 평가 담당자
                at: '2026-11-11'
              - q: 빼는 행
                a: 기본으로 빼지 않는다(모든 상태). 상태는 질문 조건으로 붙인다
                by: 지표 요청자
                at: '2026-11-11'
              - q: 기간 기준
                a: 주문일(orders.order_purchase_timestamp)
                by: 평가 담당자
                at: '2026-11-11'
              - q: 보는 단위
                a: 주문 월별(hard-011), 판매자 주별(hard-012), 카테고리·연도별(hard-019)
                by: 평가 담당자
                at: '2026-11-11'
              expected:
                value: 875
                tolerance: 1.0e-06
                where:
                - products.product_category_name IS NULL
                - orders.order_status = 'delivered'
                - orders.order_purchase_timestamp >= '2017-01-01'
                - orders.order_purchase_timestamp < '2018-01-01'
                source: 평가셋 v0.3 hard-019 정답(카테고리 빈 상품, 2017년)
      - name: item_price_total
        expression:
          sql: SUM(price)
        description: 상품 가격 합계. 주문 상품 항목의 price 합계이며 배송비와 결제 금액은 별도다. 모든 주문 상태를 기본으로 포함한다
        datatype: Decimal
        ai_context:
          synonyms: [상품 가격 합계, 상품 금액 합계, 상품 판매가 합계, 상태 제한 없는 상품 매출]
        nonportable_extensions:
          - vendor_name: TEXT2SQL
            data:
              status: approved
      - name: item_freight_total
        expression:
          sql: SUM(freight_value)
        description: 상품 항목 배송비 합계. 주문 상품 항목에 배분된 배송비를 더한다. 모든 주문 상태를 기본으로 포함한다
        datatype: Decimal
        ai_context:
          synonyms: [상품 항목 배송비 합계, 배분 배송비 합계, 상태 제한 없는 배송비 합계]
