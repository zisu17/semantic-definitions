        description: 리뷰 제목(포르투갈어 자유 입력). 비어 있을 수 있다
        ai_context:
          synonyms: [리뷰 제목]
      - name: review_comment_message
        expression: {sql: review_comment_message}
        datatype: String
        description: 리뷰 본문(포르투갈어 자유 입력). 비어 있을 수 있다
        ai_context:
          synonyms: [리뷰 내용, 리뷰 본문]
      - name: review_creation_date
