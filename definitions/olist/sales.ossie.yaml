          synonyms: [리뷰 생성일, 만족도 조사 발송일]
          instructions: 저장 값이 00:00:00인 행의 실제 발송 시각이 자정인지는 확인되지 않았다
      - name: review_answer_timestamp
        expression: {sql: review_answer_timestamp}
        datatype: DateTime
        description: 고객이 만족도 조사에 응답한 시각. 주문별 최종 리뷰를 고를 때 생성일이 같은 행을 비교한다
        ai_context:
          synonyms: [리뷰 응답 시각, 만족도 조사 응답일]
    metrics:
      - name: review_count
        expression:
          sql: COUNT(*)
        description: 리뷰 수. 리뷰 표 한 행을 한 개로 센다. 기간과 주문 상태로 거르지 않는다
        datatype: Integer
