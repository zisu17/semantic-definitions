      SQLite 사본의 리뷰 발송·응답 시각은 YYYY-MM-DD HH:MM:SS 형식의 텍스트다.
      카테고리별 리뷰는 주문에 같은 카테고리 상품이 여러 개 있어도 리뷰 한 행을 해당 카테고리에서 한 번만 센다.
      주문별 최종 리뷰가 필요한 경우 review_creation_date가 가장 늦은 행을 고르고 날짜가 같으면 review_answer_timestamp로 비교한다.
    fields:
      - name: review_id
        expression: {sql: review_id}
        datatype: String
        description: 리뷰 식별 값. 서로 다른 주문에서 같은 값이 반복될 수 있다
      - name: order_id
        expression: {sql: order_id}
        datatype: String
        description: 리뷰가 연결되는 주문 ID. 한 주문에 리뷰가 여러 행일 수 있다
      - name: review_score
        expression: {sql: review_score}
        datatype: Integer
        description: 고객의 만족도 점수 1~5. 공통 DB에서 같은 review_id의 점수가 다른 사례는 확인되지 않았다
