        description: 배송 완료 주문의 평균 리뷰 점수. 배송 완료 주문에 달린 리뷰 행의 점수(1~5)를 평균 낸다
        datatype: Decimal
        ai_context:
          synonyms: [배송 완료 주문 평균 리뷰 점수, 배송 완료 주문 평균 평점]
          instructions: >-
            카테고리 담당자가 품질 개선이 필요한 곳을 고르려고 고객 주(customers.customer_state)별로 본다.
            기간은 orders.order_purchase_timestamp(주문일) 기준으로 자른다.
            카테고리별 집계는 주문과 카테고리 조합을 한 행으로 만든 뒤 리뷰 행을 연결해야 한다.
            고객이 적은 주는 리뷰 몇 건에 평균이 크게 흔들린다(예: RR 고객 46명)
          examples: [고객 주별 평균 리뷰 점수, 평균 리뷰 점수가 가장 낮은 주 5개]
        nonportable_extensions:
          - vendor_name: TEXT2SQL
            data:
              status: approved
              decision: category_quality_improvement
              discovery:
              - q: 한 건의 단위
                a: 리뷰. 한 주문에 리뷰가 여러 개면 리뷰마다 한 번 센다
                by: 지표 요청자
                at: '2026-11-09'
              - q: 빼는 행
                a: 배송이 끝난(delivered) 주문의 리뷰만 넣는다
                by: 지표 요청자
                at: '2026-11-09'
              - q: 기간 기준
                a: 주문일(orders.order_purchase_timestamp)
                by: 지표 요청자
                at: '2026-11-09'
              - q: 보는 단위
                a: 고객 주별. 카테고리별 배분은 주문과 카테고리 조합을 중복 제거해 계산한다
                by: 지표 요청자
                at: '2026-11-09'

relationships:
  - name: order_items_to_orders
    from: order_items
    to: orders
    from_columns: [order_id]
    to_columns: [order_id]
    nonportable_extensions:
      - vendor_name: TEXT2SQL
        data:
          status: approved
  - name: order_items_to_products
    from: order_items
    to: products
    from_columns: [product_id]
    to_columns: [product_id]
    nonportable_extensions:
      - vendor_name: TEXT2SQL
        data:
          status: approved
  - name: orders_to_customers
    from: orders
    to: customers
    from_columns: [customer_id]
    to_columns: [customer_id]
    nonportable_extensions:
      - vendor_name: TEXT2SQL
        data:
          status: approved
  # 아래 연결은 Kaggle 공식 스키마(ERD) 기준. 승인 기록: order_reviews_to_orders(2026-11-09, 평균 리뷰 점수 지표), order_items_to_sellers·order_payments_to_orders·products_to_category_translation(2026-11-11, 평가셋 v0.3 지표)
  - name: order_items_to_sellers
    from: order_items
    to: sellers
    from_columns: [seller_id]
    to_columns: [seller_id]
    nonportable_extensions:
      - vendor_name: TEXT2SQL
        data:
          status: approved
  - name: order_payments_to_orders
    from: order_payments
    to: orders
    from_columns: [order_id]
    to_columns: [order_id]
    nonportable_extensions:
      - vendor_name: TEXT2SQL
        data:
          status: approved
  - name: order_reviews_to_orders
    from: order_reviews
    to: orders
    from_columns: [order_id]
    to_columns: [order_id]
    nonportable_extensions:
      - vendor_name: TEXT2SQL
        data:
          status: approved
  - name: products_to_category_translation
    from: products
    to: product_category_name_translation
    from_columns: [product_category_name]
    to_columns: [product_category_name]
    ai_context:
      instructions: 공식 ERD 그림에는 없고 번역 파일로만 있는 연결. 카테고리 2종(상품 13개)은 번역 표에 없다
    nonportable_extensions:
      - vendor_name: TEXT2SQL
        data:
          status: approved
  # 계산용 표는 원래 표의 같은 행에 잇는다(기본키끼리 1:1). 주문·고객·판매자·상품은 원래 표의 승인된 연결로 닿는다(2026-11-16)
  # 승인 기록: order_lines_to_order_items·review_lines_to_order_reviews(2026-11-16, 사용자 확인, 계산용 표로 지표 6개를 옮기며)
  - name: order_lines_to_order_items
    from: order_lines
    to: order_items
    from_columns: [order_id, order_item_id]
    to_columns: [order_id, order_item_id]
    nonportable_extensions:
      - vendor_name: TEXT2SQL
        data:
          status: approved
  - name: review_lines_to_order_reviews
    from: review_lines
    to: order_reviews
    from_columns: [review_id, order_id]
    to_columns: [review_id, order_id]
    nonportable_extensions:
      - vendor_name: TEXT2SQL
        data:
          status: approved
