# Olist(브라질 이커머스 공개 데이터) 주문·매출 지표 정의 샘플
# 형식: Apache Ossie 0.3.0.dev0, apache/ossie 커밋 da73e0e (2026-11-15) 기준
# 검증: uv run --with <ossie 클론>/python --script <ossie 클론>/validation/validate.py definitions/olist/sales.ossie.yaml
#
# 배치 규칙(우리 규칙, Ossie 스펙 아님): definitions/<DB>/<주제>.ossie.yaml
#   폴더 = DB(접속) 하나. 파일 = 그 DB 안의 주제 영역 하나 = Ossie 시맨틱 모델 하나
#   Ossie 는 파일끼리 참조가 안 되므로, 조인하거나 함께 계산하는 테이블은 같은 파일에 둔다
#
# 지표 SQL은 엔진(text2sql/engine.py)이 이 파일의 식과 연결로 만든다. LLM은 설명·동의어를 보고 지표를 고른다.
# 지표는 모두 데이터셋 지표다. 표 여러 개가 필요한 지표는 source 에 조회문을 둔 계산용 표(order_lines, review_lines)에 둔다.
#   Ossie 규격은 source 에 테이블·뷰 이름이나 쿼리를 둘 수 있다. t2s 는 SELECT 문 하나이고 이 파일의 다른 데이터셋이 가리키는 테이블만 읽는 조회문을 받는다
# Ossie에 전용 칸이 없는 것은 이렇게 적는다.
#   필터 조건: 지표 식 안에 FILTER (WHERE ...) 또는 CASE
#   시간 기준: ai_context.instructions 에 문장으로
#   승인 여부: nonportable_extensions(vendor_name: TEXT2SQL)의 data.status. approved 인 지표와 연결만 쓴다
#   정의 번호: 모델의 nonportable_extensions(TEXT2SQL)의 data.revision. CI 가 매기기 전까지 정의 에이전트가 저장할 때 1 올린다
# 확장 칸(nonportable_extensions)의 data 는 JSON 문자열이 아니라 YAML 객체로 적는다. 날짜 값은 따옴표로 감싸 문자열로 둔다(날짜 객체는 규격 오류).
# 날짜 차이는 규격대로 DATEDIFF(day, 시작, 끝)처럼 단위를 따옴표 없이 쓴다.
# source 의 테이블 이름은 실제로 적재한 DB에 맞춰 바꾼다. 이 샘플은 SQLite 테스트 데이터 기준이라 스키마 없이 적었다(PostgreSQL이면 olist.orders 처럼).
# 이 머리말 주석은 정의 에이전트가 저장해도 남는다. 본문 안의 주석은 저장할 때 사라진다.

version: 0.3.0.dev0
name: olist_sales
description: 브라질 이커머스 Olist 주문·매출
ai_context:
  instructions: >-
    데이터는 2016-09-04 ~ 2018-10-17 주문만 있다. 금액 단위는 브라질 헤알(BRL)이다.
nonportable_extensions:
  - vendor_name: TEXT2SQL
    data:
      revision: 7
      decisions:
      - id: category_quality_improvement
        decider: 카테고리 담당자
        decision: 품질 개선이 필요한 카테고리를 고른다
        action: 개선 요청·원인 분석
        grain:
        - customers.customer_state
        - products.product_category_name
        baseline: 지금은 보지 않음
      - id: eval_accuracy_comparison
        decider: 평가 담당자
        decision: 지표 정의를 넣으면 평가셋 정답률이 오르는지 판단한다
        action: 평가셋 정답과 다르면 지표 정의를 고쳐 다시 잰다
        grain:
        - customers.customer_city
        - customers.customer_state
        - order_payments.payment_type
        - order_reviews.review_creation_date__day
        - order_reviews.review_score
        - orders.order_purchase_timestamp__month
        - orders.order_purchase_timestamp__year
        - orders.order_status
        - product_category_name_translation.product_category_name_english
        - products.product_category_name
        - sellers.seller_state
        baseline: 사람이 문항마다 정답 SQL 을 짜고 따로 검산한다

datasets:
  - name: orders
    source: orders
    primary_key: [order_id]
    description: 주문 1건이 1행
    fields:
      - name: order_id
        expression: {sql: order_id}
        datatype: String
      - name: customer_id
        expression: {sql: customer_id}
        datatype: String
        description: 주문마다 새로 발급되는 고객 ID. 같은 사람을 묶으려면 customers.customer_unique_id 를 쓴다
      - name: order_status
        expression: {sql: order_status}
        datatype: String
        description: 주문 상태
        ai_context:
          instructions: >-
            값은 delivered(배송 완료), shipped(배송 중), invoiced(청구됨), processing(처리 중),
            approved(결제 승인), created(생성됨), canceled(취소), unavailable(재고 없음)
      - name: order_purchase_timestamp
        expression: {sql: order_purchase_timestamp}
        datatype: DateTime
        description: 주문일시. 기간을 묻는 질문의 기본 기준 날짜
        ai_context:
          synonyms: [주문일, 구매일]
      - name: order_delivered_customer_date
        expression: {sql: order_delivered_customer_date}
        datatype: DateTime
        description: 고객 수령일시. 배송이 끝나지 않았으면 NULL
        ai_context:
          synonyms: [배송완료일, 수령일]
      - name: order_approved_at
        expression: {sql: order_approved_at}
        datatype: DateTime
        description: 결제 승인일시
      - name: order_delivered_carrier_date
        expression: {sql: order_delivered_carrier_date}
        datatype: DateTime
        description: 물류사 인계일시
      - name: order_estimated_delivery_date
        expression: {sql: order_estimated_delivery_date}
        datatype: DateTime
        description: 주문 때 고객에게 안내한 예상 배송일
    metrics:
      - name: order_count
        expression:
          sql: COUNT(order_id) FILTER (WHERE order_status NOT IN ('canceled', 'unavailable'))
        description: 주문 수. 취소와 재고 없음 주문은 뺀다
        datatype: Integer
        ai_context:
          synonyms: [주문 수, 주문 건수]
          instructions: 기간은 order_purchase_timestamp(주문일) 기준으로 자른다. 일, 주, 월 단위로 볼 수 있다
        nonportable_extensions:
          - vendor_name: TEXT2SQL
            data:
              status: approved
      - name: avg_delivery_days
        expression:
          sql: AVG(DATEDIFF(day, order_purchase_timestamp, order_delivered_customer_date)) FILTER (WHERE order_status = 'delivered')
        description: 평균 배송일수. 주문일부터 고객 수령일까지 달력 기준 일수
        datatype: Decimal
        ai_context:
          synonyms: [배송 소요일, 달력 기준 배송 일수]
          instructions: 기간은 주문일 기준. 시작 시점을 주문일로 볼지 결제 승인일로 볼지 아직 정하지 않았다
        nonportable_extensions:
          - vendor_name: TEXT2SQL
            data:
              status: draft
      - name: all_order_count
        expression:
          sql: COUNT(order_id)
        description: 전체 주문 수. 취소와 재고 없음을 포함해 모든 주문 상태의 주문을 센다
        datatype: Integer
        ai_context:
          synonyms: [전체 주문 수, 모든 주문 수, 들어온 주문 수, 상태별 주문 수]
          instructions: >-
            주문 상태(order_status)별, 주문 월별로 본다.
            주문 한 건을 한 번 센다. 주문 상태로 거르지 않는다(취소·재고 없음 포함).
            질문이 상태를 정하면 order_status 조건을 붙인다.
            기간은 order_purchase_timestamp(주문일) 기준으로 자른다.
            order_count 지표는 취소와 재고 없음을 빼므로 값이 다르다
          examples: [2017년에 들어온 주문의 주문 상태별 건수, 2018년 8월에 들어온 주문 수]
        nonportable_extensions:
          - vendor_name: TEXT2SQL
            data:
              status: approved
              decision: eval_accuracy_comparison
              discovery:
              - q: 한 건의 단위
                a: 주문 1건
                by: 평가 담당자
                at: '2026-11-11'
              - q: 빼는 행
                a: 빼지 않는다. 취소·재고 없음도 센다(bird-001, bird-006 은 모든 상태)
                by: 평가 담당자
                at: '2026-11-11'
              - q: 기간 기준
                a: 주문일(orders.order_purchase_timestamp)
                by: 평가 담당자
                at: '2026-11-11'
              - q: 보는 단위
                a: 주문 상태별(bird-001), 기간 전체 합(bird-006)
                by: 평가 담당자
                at: '2026-11-11'
              - q: 비슷한 지표와 따로 두는 이유
                a: order_count 는 취소·재고 없음을 빼서 상태별 건수를 낼 수 없다
                by: 평가 담당자
                at: '2026-11-11'
              expected:
                value: 6512
                tolerance: 1.0e-06
                where:
                - orders.order_purchase_timestamp >= '2018-08-01'
                - orders.order_purchase_timestamp < '2018-09-01'
                source: 평가셋 v0.3 bird-006 정답
      - name: avg_delivery_days_exact
        expression:
          sql: AVG(CASE WHEN order_status <> 'delivered' THEN NULL ELSE DATEDIFF(second, order_purchase_timestamp, order_delivered_customer_date) / 86400.0 END)
        description: 평균 배송 일수. 배송 완료 주문의 구매 시각부터 고객 도착 시각까지 걸린 시간을 일 단위(소수 포함)로 평균 낸다
        datatype: Decimal
        ai_context:
          synonyms: [평균 배송 일수, 배송 기간, 배송이 걸린 기간]
          instructions: >-
            고객 주(customers.customer_state)별로 본다.
            배송 완료(delivered) 주문만 넣고, 도착 시각이 빈 주문은 뺀다.
            배송 일수는 도착 시각 − 구매 시각을 시·분·초까지 반영한 일 단위 실수다. 달력 날짜끼리 뺀 정수 일수가 아니다.
            기간은 order_purchase_timestamp(주문일) 기준으로 자른다.
            avg_delivery_days 지표는 달력 날짜 차이라 값이 다르다
          examples: [2017년 배송 완료 주문 기준 평균 배송 일수가 가장 긴 고객 주 5곳]
        nonportable_extensions:
          - vendor_name: TEXT2SQL
            data:
              status: approved
              decision: eval_accuracy_comparison
              discovery:
              - q: 한 건의 단위
                a: 주문 1건
                by: 평가 담당자
                at: '2026-11-11'
              - q: 빼는 행
                a: delivered 가 아닌 주문, 도착 시각이 빈 주문(bird-007)
                by: 평가 담당자
                at: '2026-11-11'
              - q: 일수 계산
                a: 도착 시각 − 구매 시각, 일 단위 소수 포함
                by: 평가 담당자
                at: '2026-11-11'
              - q: 기간 기준
                a: 주문일(orders.order_purchase_timestamp)
                by: 평가 담당자
                at: '2026-11-11'
              - q: 보는 단위
                a: 고객 주별(bird-007)
                by: 평가 담당자
                at: '2026-11-11'
              - q: 비슷한 지표와 따로 두는 이유
                a: avg_delivery_days 는 달력 날짜 차이(정수)라 bird-007 의 소수 일수와 다르다
                by: 평가 담당자
                at: '2026-11-11'
              expected:
                value: 32.1
                tolerance: 0.0002
                where:
                - customers.customer_state = 'RR'
                - orders.order_purchase_timestamp >= '2017-01-01'
                - orders.order_purchase_timestamp < '2018-01-01'
                source: 평가셋 v0.3 bird-007 정답(RR, 소수 둘째 자리 반올림)
      - name: delivery_judged_order_count
        expression:
          sql: >-
            COUNT(CASE
              WHEN order_status <> 'delivered' THEN NULL
              WHEN order_delivered_customer_date IS NULL THEN NULL
              WHEN order_estimated_delivery_date IS NULL THEN NULL
              ELSE order_id
            END)
        description: 지연 판정 대상 주문 수. 배송 완료 주문 중 실제 도착일과 예상 도착일이 모두 있는 주문을 센다
        datatype: Integer
        ai_context:
          synonyms: [지연 판정 대상 주문 수, 배송 지연 대상 주문 수, 대상 주문 수, 도착일이 기록된 배송 완료 주문 수]
          instructions: >-
            주문 연도·기간으로 잘라 본다.
            배송 완료(delivered)이면서 실제 도착일과 예상 도착일이 모두 있는 주문을 한 번씩 센다. 배송 지연 비율(late_delivery_rate)의 분모다.
            기간은 order_purchase_timestamp(주문일) 기준으로 자른다
          examples: [2017년 구매한 배송 완료 주문 중 도착일이 모두 기록된 주문 수]
        nonportable_extensions:
          - vendor_name: TEXT2SQL
            data:
              status: approved
              decision: eval_accuracy_comparison
              discovery:
              - q: 한 건의 단위
                a: 주문 1건
                by: 평가 담당자
                at: '2026-11-11'
              - q: 빼는 행
                a: delivered 가 아닌 주문, 실제 도착일이나 예상 도착일이 빈 주문(bang-002)
                by: 평가 담당자
                at: '2026-11-11'
              - q: 기간 기준
                a: 주문일(orders.order_purchase_timestamp)
                by: 평가 담당자
                at: '2026-11-11'
              expected:
                value: 43426
                tolerance: 1.0e-06
                where:
                - orders.order_purchase_timestamp >= '2017-01-01'
                - orders.order_purchase_timestamp < '2018-01-01'
                source: 평가셋 v0.3 bang-002 정답
      - name: late_delivery_rate
        expression:
          sql: >-
            AVG(CASE
              WHEN order_status <> 'delivered' THEN NULL
              WHEN order_delivered_customer_date IS NULL THEN NULL
              WHEN order_estimated_delivery_date IS NULL THEN NULL
              WHEN DATEDIFF(day, order_estimated_delivery_date, order_delivered_customer_date) > 0 THEN 100.0
              ELSE 0.0
            END)
        description: 배송 지연 비율(%). 배송 완료 주문 중 실제 도착 날짜가 예상 도착 날짜보다 뒤인 주문의 비율이고 0~100 단위다
        datatype: Decimal
        ai_context:
          synonyms: [배송 지연 비율, 지연 배송 비율, 지연율, 늦게 도착한 비율]
          instructions: >-
            주문 연도·기간으로 잘라 본다.
            대상(분모)은 배송 완료(delivered)이면서 실제 도착일과 예상 도착일이 모두 있는 주문이다. 도착일이 빈 주문은 판단할 수 없어 뺀다.
            지연은 날짜만 비교해 실제 도착 날짜가 예상 도착 날짜보다 뒤인 경우다. 예상일 당일 도착은 지연이 아니다.
            예상 도착일은 모두 0시라 시각까지 비교하면 당일 도착이 지연으로 잘못 잡힌다.
            값은 0~100 단위 퍼센트다.
            기간은 order_purchase_timestamp(주문일) 기준으로 자른다
          examples: [2017년 구매한 배송 완료 주문의 배송 지연 비율]
        nonportable_extensions:
          - vendor_name: TEXT2SQL
            data:
              status: approved
              decision: eval_accuracy_comparison
              discovery:
              - q: 한 건의 단위
                a: 주문 1건
                by: 평가 담당자
                at: '2026-11-11'
              - q: 빼는 행
                a: delivered 가 아닌 주문, 실제 도착일이나 예상 도착일이 빈 주문(bang-002)
                by: 평가 담당자
                at: '2026-11-11'
              - q: 지연 판정
                a: date(실제 도착일) > date(예상 도착일). 예상일 당일 도착은 지연이 아니다
                by: 평가 담당자
                at: '2026-11-11'
              - q: 기간 기준
                a: 주문일(orders.order_purchase_timestamp)
                by: 평가 담당자
                at: '2026-11-11'
              - q: 값의 단위
                a: 0~100 퍼센트
                by: 평가 담당자
                at: '2026-11-11'
              expected:
                value: 5.6487
                tolerance: 1.0e-05
                where:
                - orders.order_purchase_timestamp >= '2017-01-01'
                - orders.order_purchase_timestamp < '2018-01-01'
                source: 평가셋 v0.3 bang-002 정답(43,426건 중 2,453건)
      - name: late_order_count
        expression:
          sql: >-
            COUNT(CASE
              WHEN order_status <> 'delivered' THEN NULL
              WHEN order_delivered_customer_date IS NULL THEN NULL
              WHEN order_estimated_delivery_date IS NULL THEN NULL
              WHEN DATEDIFF(day, order_estimated_delivery_date, order_delivered_customer_date) > 0 THEN order_id
            END)
        description: 지연 주문 수. 배송 완료 주문 중 실제 도착 날짜가 예상 도착 날짜보다 뒤인 주문을 센다
        datatype: Integer
        ai_context:
          synonyms: [지연 주문 수, 배송 지연 주문 수, 늦게 도착한 주문 수]
          instructions: >-
            주문 연도·기간으로 잘라 본다.
