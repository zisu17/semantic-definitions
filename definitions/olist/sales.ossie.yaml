  - name: order_lines
    source: >-
      SELECT oi.order_id, oi.order_item_id, oi.shipping_limit_date, oi.price, oi.freight_value,
      o.order_status, o.order_delivered_carrier_date, c.customer_unique_id, c.customer_state, s.seller_state
      FROM order_items AS oi
      LEFT JOIN orders AS o ON o.order_id = oi.order_id
      LEFT JOIN customers AS c ON c.customer_id = o.customer_id
      LEFT JOIN sellers AS s ON s.seller_id = oi.seller_id
    primary_key: [order_id, order_item_id]
    description: >-
      지표 계산용 표. 주문 상품 1줄이 1행이고 주문·고객·판매자 값을 붙였다. 붙인 연결은 모두 N:1 이라 행 수는 order_items 와 같다.
      order_items 의 같은 행에 이어져 있다. 묶음 기준과 조건은 원래 표 필드(order_items, orders, customers, sellers, products)를 쓴다
    fields:
      - name: order_id
        expression: {sql: order_id}
        datatype: String
      - name: order_item_id
        expression: {sql: order_item_id}
        datatype: Integer
        description: 주문 안에서의 상품 순번(1부터)
      - name: shipping_limit_date
        expression: {sql: shipping_limit_date}
        datatype: DateTime
        description: 판매자가 물류사에 넘겨야 하는 기한
      - name: price
        expression: {sql: price}
        datatype: Decimal
        description: 상품 가격. 배송비는 들어 있지 않다
      - name: freight_value
        expression: {sql: freight_value}
        datatype: Decimal
        description: 배송비
      - name: order_status
        expression: {sql: order_status}
        datatype: String
        description: 계산용 사본. 묶거나 거를 때는 orders.order_status 를 쓴다
      - name: order_delivered_carrier_date
        expression: {sql: order_delivered_carrier_date}
        datatype: DateTime
        description: 계산용 사본. 묶거나 거를 때는 orders.order_delivered_carrier_date 를 쓴다
      - name: customer_unique_id
        expression: {sql: customer_unique_id}
        datatype: String
        description: 계산용 사본. 묶거나 거를 때는 customers.customer_unique_id 를 쓴다
      - name: customer_state
        expression: {sql: customer_state}
        datatype: String
        description: 계산용 사본. 묶거나 거를 때는 customers.customer_state 를 쓴다
      - name: seller_state
        expression: {sql: seller_state}
        datatype: String
        description: 계산용 사본. 묶거나 거를 때는 sellers.seller_state 를 쓴다
    metrics:
      - name: revenue
        expression:
          sql: SUM(price) FILTER (WHERE order_status NOT IN ('canceled', 'unavailable'))
        description: 매출. 상품 가격 합계이고 배송비는 뺀다. 취소와 재고 없음 주문도 뺀다
        datatype: Decimal
        ai_context:
          synonyms: [매출, 매출액, 판매액]
          instructions: >-
            기간은 orders.order_purchase_timestamp(주문일) 기준으로 자른다. 일, 주, 월 단위로 볼 수 있다.
            배송비까지 포함한 금액을 물으면 freight 지표를 함께 계산해 더하고, 그렇게 더했다고 답에 밝힌다
          examples: [지난달 매출, 카테고리별 매출 상위 10개, 주별 매출 추이]
        nonportable_extensions:
          - vendor_name: TEXT2SQL
            data:
              status: approved
      - name: freight
        expression:
          sql: SUM(freight_value) FILTER (WHERE order_status NOT IN ('canceled', 'unavailable'))
        description: 배송비 합계. 취소와 재고 없음 주문은 뺀다
        datatype: Decimal
        ai_context:
          synonyms: [배송비, 운송비]
          instructions: 기간은 orders.order_purchase_timestamp(주문일) 기준으로 자른다. 매출(revenue)에는 배송비가 들어 있지 않다
        nonportable_extensions:
          - vendor_name: TEXT2SQL
            data:
              status: approved
      - name: purchasing_customers
        expression:
          sql: COUNT(DISTINCT customer_unique_id) FILTER (WHERE order_status NOT IN ('canceled', 'unavailable'))
        description: 구매 고객 수. 상품을 산 실제 고객(customer_unique_id)을 한 번씩 센다. 취소와 재고 없음 주문은 뺀다
        datatype: Integer
        ai_context:
          synonyms: [구매 고객 수, 고객 수, 구매자 수, 산 고객 수]
          instructions: >-
            평가 담당자가 지표 정의를 넣으면 평가셋 정답률이 오르는지 보려고 쓴다.
            주문 월(orders.order_purchase_timestamp__month)별, 상품 카테고리(products.product_category_name)별로 본다.
            고객은 customers.customer_unique_id 로 센다. customer_id 는 주문마다 새로 붙어 주문 수가 된다.
            상품이 담긴 주문의 고객만 센다. 카테고리별로 보면 그 카테고리 상품을 산 고객이고, 여러 카테고리를 산 고객은 각 카테고리에 한 번씩 들어간다.
            기간은 orders.order_purchase_timestamp(주문일) 기준으로 자른다
          examples: [2018년 1~7월 월별 구매 고객 수, 2018년 1월 카테고리별 구매 고객 수]
        nonportable_extensions:
          - vendor_name: TEXT2SQL
            data:
              status: approved
              decision: eval_accuracy_comparison
              discovery:
              - q: 한 건의 단위
                a: 실제 고객(customers.customer_unique_id) 한 명
                by: 평가 담당자
                at: '2026-11-11'
              - q: 빼는 행
                a: 취소·재고 없음 주문, 상품이 없는 주문(kmk-001, kmk-003)
                by: 평가 담당자
                at: '2026-11-11'
              - q: 기간 기준
                a: 주문일(orders.order_purchase_timestamp)
                by: 평가 담당자
                at: '2026-11-11'
              - q: 보는 단위
                a: 주문 월별(kmk-003), 주문 월·카테고리별(kmk-001)
                by: 평가 담당자
                at: '2026-11-11'
              expected:
                value: 7088
                tolerance: 1.0e-06
                where:
                - orders.order_purchase_timestamp >= '2018-01-01'
                - orders.order_purchase_timestamp < '2018-02-01'
                source: 평가셋 v0.3 kmk-003 정답(2018-01 구매 고객 수)
      - name: same_state_item_rate
        expression:
          sql: 100.0 * COUNT(*) FILTER (WHERE seller_state = customer_state) / COUNT(*)
        description: 판매자·고객 같은 주 비율(%). 주문 상품 줄 중 판매자의 주와 고객의 주가 같은 줄의 비율이고 0~100 단위다. 주문 상태는 기본으로 거르지 않는다
        datatype: Decimal
        ai_context:
          synonyms: [같은 주 비율, 판매자와 고객이 같은 주인 비율, 주 내 거래 비율, 같은 지역 판매 비율]
          instructions: >-
            전체 값으로 보거나 주문 상태·기간으로 잘라 본다.
            주문 상품 한 줄을 한 번 센다. 같은 주는 sellers.seller_state = customers.customer_state 다.
            값은 0~100 단위 퍼센트다.
            주문 상태는 기본으로 거르지 않는다. 질문이 배송 완료 등을 정하면 orders.order_status 조건을 붙인다.
            기간은 orders.order_purchase_timestamp(주문일) 기준으로 자른다
          examples: [배송 완료 주문의 상품 중 판매자와 고객이 같은 주에 있는 비율]
        nonportable_extensions:
          - vendor_name: TEXT2SQL
            data:
              status: approved
              decision: eval_accuracy_comparison
              discovery:
              - q: 한 건의 단위
                a: 주문 상품 1행(order_items)
                by: 평가 담당자
                at: '2026-11-11'
              - q: 같은 주 판정
                a: customers.customer_state = sellers.seller_state(bird-014)
                by: 평가 담당자
                at: '2026-11-11'
              - q: 빼는 행
                a: 기본으로 빼지 않는다(모든 상태). item_count 와 같은 기준
                by: 지표 요청자
                at: '2026-11-11'
              - q: 값의 단위
                a: 0~100 퍼센트
                by: 평가 담당자
                at: '2026-11-11'
              expected:
                value: 36.177
                tolerance: 0.0002
                where:
                - orders.order_status = 'delivered'
                source: 평가셋 v0.3 bird-014 정답(110,197줄 중 39,866줄)
      - name: shipping_limit_on_time_rate
        expression:
          sql: 100.0 * COUNT(*) FILTER (WHERE DATEDIFF(day, order_delivered_carrier_date, shipping_limit_date) >= 0) / COUNT(*) FILTER (WHERE order_delivered_carrier_date IS NOT NULL)
        description: 발송 기한 준수율(%). 택배사에 넘긴 주문 상품 줄 중 인계 날짜가 발송 기한 날짜 이전(같은 날 포함)인 줄의 비율이고 0~100 단위다
        datatype: Decimal
        ai_context:
          synonyms: [발송 기한 준수율, 택배사 인계 기한 준수율, 기한 준수 비율, 출고 기한 준수율]
          instructions: >-
            판매자 주(sellers.seller_state)별로 본다.
            주문 상품 한 줄을 한 번 센다. 택배사 인계 시각(order_delivered_carrier_date)이 빈 줄은 분자·분모에서 뺀다.
            준수는 날짜만 비교해 인계 날짜 ≤ 발송 기한(shipping_limit_date) 날짜다. 같은 날이면 준수다.
            값은 0~100 단위 퍼센트다.
            주문 상태는 기본으로 거르지 않는다. 질문이 배송 완료 등을 정하면 orders.order_status 조건을 붙인다.
            상품 줄이 적은 주를 빼라고 하면 item_count 지표를 같은 조건으로 함께 계산해 거른다.
            기간은 orders.order_purchase_timestamp(주문일) 기준으로 자른다
          examples: [2018년 배송 완료 주문 기준 발송 기한 준수율이 낮은 판매자 주 5곳]
        nonportable_extensions:
          - vendor_name: TEXT2SQL
            data:
              status: approved
              decision: eval_accuracy_comparison
              discovery:
              - q: 한 건의 단위
                a: 주문 상품 1행(order_items)
                by: 평가 담당자
                at: '2026-11-11'
              - q: 빼는 행
                a: 택배사 인계 시각이 빈 줄(hard-012). 주문 상태는 기본으로 거르지 않는다(item_count 와 같은 기준)
                by: 평가 담당자
                at: '2026-11-11'
              - q: 준수 판정
                a: date(인계 시각) <= date(발송 기한). 같은 날이면 준수
                by: 평가 담당자
                at: '2026-11-11'
              - q: 기간 기준
                a: 주문일(orders.order_purchase_timestamp)
                by: 평가 담당자
                at: '2026-11-11'
              - q: 값의 단위
                a: 0~100 퍼센트
                by: 평가 담당자
                at: '2026-11-11'
              - q: 보는 단위
                a: 판매자 주별(hard-012)
                by: 평가 담당자
                at: '2026-11-11'
              expected:
                value: 92.74
                tolerance: 0.0001
                where:
                - sellers.seller_state = 'PR'
                - orders.order_status = 'delivered'
                - orders.order_purchase_timestamp >= '2018-01-01'
                - orders.order_purchase_timestamp < '2019-01-01'
                source: 평가셋 v0.3 hard-012 정답(PR, 소수 둘째 자리 반올림)

  - name: review_lines
    source: >-
      SELECT r.review_id, r.order_id, r.review_score, o.order_status
      FROM order_reviews AS r
      LEFT JOIN orders AS o ON o.order_id = r.order_id
    primary_key: [review_id, order_id]
    description: >-
      지표 계산용 표. 리뷰 1건이 1행이고 그 주문의 상태를 붙였다. 행 수는 order_reviews 와 같다.
      order_reviews 의 같은 행에 이어져 있다. 묶음 기준과 조건은 원래 표 필드(order_reviews, orders, customers)를 쓴다
    fields:
      - name: review_id
        expression: {sql: review_id}
        datatype: String
      - name: order_id
        expression: {sql: order_id}
        datatype: String
      - name: review_score
        expression: {sql: review_score}
        datatype: Integer
        description: 만족도 점수 1~5
      - name: order_status
        expression: {sql: order_status}
        datatype: String
        description: 계산용 사본. 묶거나 거를 때는 orders.order_status 를 쓴다
    metrics:
      - name: avg_review_score
        expression:
          sql: AVG(review_score) FILTER (WHERE order_status = 'delivered')
        description: 평균 리뷰 점수. 배송이 끝난 주문에 달린 리뷰 점수(1~5)의 평균이고, 한 주문에 리뷰가 여러 개면 리뷰마다 한 번 센다
        datatype: Decimal
        ai_context:
          synonyms: [평균 리뷰 점수, 평균 평점, 리뷰 점수 평균, 만족도 평균]
          instructions: >-
            카테고리 담당자가 품질 개선이 필요한 곳을 고르려고 고객 주(customers.customer_state)별로 본다.
            기간은 orders.order_purchase_timestamp(주문일) 기준으로 자른다.
            카테고리별은 아직 계산할 수 없다. 주문 하나에 여러 카테고리 상품이 들어 있어 리뷰를 카테고리에 나눌 규칙이 먼저 필요하다.
            고객이 적은 주는 리뷰 몇 건에 평균이 크게 흔들린다(예: RR 고객 46명)
          examples: [고객 주별 평균 리뷰 점수, 평균 리뷰 점수가 가장 낮은 주 5개]
        nonportable_extensions:
          - vendor_name: TEXT2SQL
            data:
              status: approved
              decision: category_quality_improvement
              discovery:
              - q: 한 건의 단위
                a: 리뷰. 한 주문에 리뷰가 여러 개면 리뷰마다 한 번 센다
                by: 지표 요청자
                at: '2026-11-09'
              - q: 빼는 행
                a: 배송이 끝난(delivered) 주문의 리뷰만 넣는다
                by: 지표 요청자
                at: '2026-11-09'
              - q: 기간 기준
                a: 주문일(orders.order_purchase_timestamp)
                by: 지표 요청자
                at: '2026-11-09'
              - q: 보는 단위
                a: 고객 주별. 카테고리별은 리뷰를 카테고리에 나눌 규칙이 생긴 뒤
                by: 지표 요청자
                at: '2026-11-09'

