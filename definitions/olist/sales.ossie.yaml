          instructions: >-
            리뷰 점수(review_score)별로 본다.
            리뷰 한 행을 한 번 센다. 한 주문에 리뷰가 여러 개면 모두 센다. 리뷰가 달린 주문 수가 아니다.
            기간을 물으면 review_creation_date(리뷰 생성일)로 자른다. 주문일·주문 상태로 거르라고 하면 orders.order_purchase_timestamp, orders.order_status 조건을 붙인다
