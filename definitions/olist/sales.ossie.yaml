                at: '2026-11-11'
              - q: 값의 단위
                a: 0~100 퍼센트
                by: 평가 담당자
                at: '2026-11-11'
              - q: 보는 단위
                a: 리뷰 생성일별(js-002)
                by: 평가 담당자
                at: '2026-11-11'
              expected:
                value: 17.2414
                tolerance: 0.0001
                where:
                - order_reviews.review_creation_date >= '2018-07-15'
                - order_reviews.review_creation_date < '2018-07-16'
                source: 평가셋 v0.3 js-002 정답 메모(2018-07-15 리뷰 87건 중 15건)
      - name: avg_review_answer_days
